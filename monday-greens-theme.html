<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monday Greens · Theme Playground</title>
<style>
    :root {
        --ui-bg: #0f1417; --ui-panel: #161d21; --ui-panel2: #1d262b;
        --ui-border: #2a353b; --ui-text: #e7f0ee; --ui-dim: #8aa39c;
        --ui-accent: #5effe4; --ui-accent-ink: #05231a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--ui-bg); color: var(--ui-text);
        font-family: 'Nunito', system-ui, -apple-system, Segoe UI, sans-serif;
        display: grid; grid-template-columns: minmax(360px, 460px) 1fr;
        height: 100vh; overflow: hidden;
    }
    /* ── Left: controls ── */
    .panel { overflow-y: auto; padding: 20px 20px 60px; border-right: 1px solid var(--ui-border); }
    .panel::-webkit-scrollbar { width: 10px; }
    .panel::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius: 6px; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .head h1 { font-size: 1.05rem; letter-spacing: 0.3px; }
    .head .tag { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 2px; color: var(--ui-accent); }
    .sub { font-size: 0.76rem; color: var(--ui-dim); margin-bottom: 16px; line-height: 1.5; }
    .sub code { background: var(--ui-panel2); padding: 1px 5px; border-radius: 4px; color: var(--ui-text); }

    .seg { display: flex; gap: 6px; background: var(--ui-panel); padding: 5px; border-radius: 12px; margin-bottom: 16px; }
    .seg button {
        flex: 1; background: transparent; border: none; color: var(--ui-dim);
        font: inherit; font-weight: 800; font-size: 0.78rem; padding: 8px; border-radius: 8px; cursor: pointer;
        letter-spacing: 0.5px;
    }
    .seg button.on { background: var(--ui-accent); color: var(--ui-accent-ink); }

    .group-title {
        font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2.5px; color: var(--ui-dim);
        margin: 18px 2px 8px; font-weight: 800;
    }
    .row {
        display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
        background: var(--ui-panel); border: 1px solid var(--ui-border); border-radius: 12px;
        padding: 9px 11px; margin-bottom: 7px;
    }
    .row .lbl { font-size: 0.78rem; }
    .row .var { font-size: 0.62rem; color: var(--ui-dim); font-family: ui-monospace, monospace; }
    .row input[type=color] {
        width: 40px; height: 34px; border: 1px solid var(--ui-border); border-radius: 8px;
        background: none; padding: 2px; cursor: pointer;
    }
    .row .val { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .row .txt {
        width: 150px; background: var(--ui-panel2); border: 1px solid var(--ui-border); color: var(--ui-text);
        border-radius: 7px; padding: 4px 7px; font: inherit; font-size: 0.72rem; font-family: ui-monospace, monospace;
    }
    .row .alpha { width: 96px; accent-color: var(--ui-accent); }
    .row .alpha-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.6rem; color: var(--ui-dim); }
    .swatch {
        width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--ui-border);
        background-image: linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%);
        background-size: 10px 10px; background-position: 0 0,0 5px,5px -5px,-5px 0;
    }
    .swatch > span { display: block; width: 100%; height: 100%; border-radius: inherit; }

    /* ── Logos ── */
    .logo-block { background: var(--ui-panel); border: 1px solid var(--ui-border); border-radius: 12px; padding: 11px; margin-bottom: 9px; }
    .logo-block h3 { font-size: 0.78rem; margin-bottom: 8px; }
    .variants { display: flex; gap: 7px; flex-wrap: wrap; }
    .variants button {
        border: 2px solid var(--ui-border); border-radius: 9px; padding: 6px; cursor: pointer; background: #12181b;
        width: 74px; height: 46px; display: flex; align-items: center; justify-content: center;
    }
    .variants button.on { border-color: var(--ui-accent); }
    .variants button.dark { background: #0c1418; }
    .variants button.light { background: #eef3f1; }
    .variants img { max-width: 100%; max-height: 100%; }
    .upload { margin-top: 8px; }
    .upload label {
        display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px;
        border: 1px dashed var(--ui-border); color: var(--ui-dim); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    }
    .upload input { display: none; }

    .actions { display: flex; gap: 8px; margin-top: 20px; }
    .actions button {
        flex: 1; font: inherit; font-weight: 800; font-size: 0.78rem; padding: 11px; border-radius: 10px; cursor: pointer;
        border: 1px solid var(--ui-border); background: var(--ui-panel); color: var(--ui-text);
    }
    .actions .primary { background: var(--ui-accent); color: var(--ui-accent-ink); border-color: transparent; }
    .actions .danger { color: #ff8f8f; border-color: #5a2b2b; }

    textarea#export {
        width: 100%; height: 190px; margin-top: 12px; display: none;
        background: #0b0f11; border: 1px solid var(--ui-border); color: #cfe; border-radius: 10px;
        padding: 10px; font-family: ui-monospace, monospace; font-size: 0.72rem; resize: vertical;
    }

    /* ── Right: preview ── */
    .stage {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background:
            radial-gradient(60% 50% at 50% 0%, #17252a 0%, transparent 70%), var(--ui-bg);
        padding: 20px; overflow: hidden;
    }
    .stage-bar { display: flex; align-items: center; gap: 10px; font-size: 0.72rem; color: var(--ui-dim); }
    .stage-bar b { color: var(--ui-text); }
    .stage-bar button {
        font: inherit; font-size: 0.72rem; font-weight: 800; background: var(--ui-panel); color: var(--ui-text);
        border: 1px solid var(--ui-border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    }
    .phone {
        width: 402px; max-width: 92vw; height: min(84vh, 860px);
        border-radius: 40px; border: 10px solid #05090b; background: #000;
        box-shadow: 0 30px 80px rgba(0,0,0,0.55); overflow: hidden; position: relative;
    }
    .phone iframe { width: 100%; height: 100%; border: none; display: block; }
    @media (max-width: 900px) {
        body { grid-template-columns: 1fr; }
        .stage { display: none; }
    }
</style>
</head>
<body>
    <div class="panel">
        <div class="head">
            <h1>Monday Greens · Theme</h1>
            <span class="tag">Playground</span>
        </div>
        <p class="sub">
            Test any colours + logos live on top of the current branch. Changes are saved in
            this browser only (<code>localStorage</code>) — no effect on the live site. Use
            <b>Export</b> to hand off the final palette.
        </p>

        <div class="seg" id="theme-seg">
            <button data-theme="day" class="on">☀︎ Light</button>
            <button data-theme="night">☾ Dark</button>
        </div>

        <div id="controls"></div>

        <div class="group-title">Logos</div>
        <div id="logos"></div>

        <div class="actions">
            <button class="primary" id="btn-export">Export CSS</button>
            <button id="btn-reload">Reload preview</button>
            <button class="danger" id="btn-reset">Reset all</button>
        </div>
        <textarea id="export" readonly spellcheck="false"></textarea>
    </div>

    <div class="stage">
        <div class="stage-bar">
            <span>Previewing: <b id="preview-theme">Light</b></span>
            <button id="btn-toggle-preview">Toggle light/dark</button>
        </div>
        <div class="phone"><iframe id="preview" src="./monday-greens.html"></iframe></div>
    </div>

<script>
(() => {
    const STORE_KEY = 'mg-theme-overrides';
    const VAR_GROUPS = [
        { title: 'Surfaces', vars: [
            ['--bg', 'Page background'], ['--bg2', 'Background 2'],
            ['--card', 'Card'], ['--card2', 'Card gradient end'],
            ['--thumb-bg', 'Thumbnail bg'], ['--modal-bg', '3D modal bg'],
        ]},
        { title: 'Text', vars: [ ['--text', 'Text'], ['--dim', 'Muted text'] ]},
        { title: 'Accent', vars: [
            ['--accent', 'Accent (primary)'], ['--accent2', 'Accent gradient end'], ['--accent-text', 'Text on accent'],
        ]},
        { title: 'Lines & light', vars: [
            ['--border', 'Borders'], ['--glow', 'Glow / halo'], ['--glow2', 'Glow 2'], ['--shadow', 'Shadow'],
        ]},
        { title: 'Advanced', vars: [ ['--modal-rgb', 'Modal RGB', 'triplet'] ]},
    ];
    const ALL_VARS = VAR_GROUPS.flatMap(g => g.vars);
    const LOGO_SLOTS = [
        { id: 'hero',      name: 'Hero logo (over photo)', dark: true },
        { id: 'menuDay',   name: 'Menu logo — light theme', dark: false },
        { id: 'menuNight', name: 'Menu logo — dark theme',  dark: true },
    ];
    const LOGO_VARIANTS = [
        { id: 'white', src: './img/mg-logo-white.png' },
        { id: 'green', src: './img/mg-logo-green.png' },
        { id: 'cream', src: './img/mg-logo-cream.png' },
        { id: 'black', src: './img/mg-logo-black.png' },
    ];

    const iframe = document.getElementById('preview');
    const state = { theme: 'day', defaults: { day: {}, night: {} }, values: { day: {}, night: {} }, logos: {} };
    let rowComponents = {}; // key -> {r,g,b,a,triplet}

    // ── colour parse / format ─────────────────────────────────────────
    function parse(str) {
        str = (str || '').trim();
        let m;
        if ((m = str.match(/^(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})$/)))
            return { r: +m[1], g: +m[2], b: +m[3], a: 1, triplet: true };
        if (str[0] === '#') {
            let h = str.slice(1);
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const r = parseInt(h.slice(0,2),16)||0, g = parseInt(h.slice(2,4),16)||0, b = parseInt(h.slice(4,6),16)||0;
            const a = h.length >= 8 ? parseInt(h.slice(6,8),16)/255 : 1;
            return { r, g, b, a };
        }
        if ((m = str.match(/rgba?\(([^)]+)\)/))) {
            const p = m[1].split(',').map(s => s.trim());
            return { r: +p[0]||0, g: +p[1]||0, b: +p[2]||0, a: p[3] === undefined ? 1 : +p[3] };
        }
        return { r: 0, g: 0, b: 0, a: 1 };
    }
    const hx = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
    function toHexInput(c) { return '#' + hx(c.r) + hx(c.g) + hx(c.b); }
    function format(c) {
        if (c.triplet) return `${c.r},${c.g},${c.b}`;
        if (c.a >= 1) return toHexInput(c);
        return `rgba(${Math.round(c.r)},${Math.round(c.g)},${Math.round(c.b)},${+c.a.toFixed(2)})`;
    }

    // ── read branch defaults from the iframe's stylesheet ──────────────
    function readThemeVars(sel) {
        const out = {};
        const sheets = iframe.contentDocument.styleSheets;
        for (const sheet of sheets) {
            if (sheet.ownerNode && sheet.ownerNode.id === 'mg-overrides') continue;
            let rules; try { rules = sheet.cssRules; } catch (e) { continue; }
            if (!rules) continue;
            for (const rule of rules) {
                if (rule.selectorText === sel) {
                    ALL_VARS.forEach(([k]) => {
                        const v = rule.style.getPropertyValue(k).trim();
                        if (v && !(k in out)) out[k] = v;
                    });
                }
            }
        }
        return out;
    }

    // ── store / push ──────────────────────────────────────────────────
    function buildStore() {
        const store = { day: {}, night: {}, logos: { ...state.logos } };
        ['day', 'night'].forEach(t => {
            ALL_VARS.forEach(([k]) => {
                const cur = state.values[t][k];
                if (cur != null && cur !== state.defaults[t][k]) store[t][k] = cur;
            });
        });
        return store;
    }
    function push() {
        const store = buildStore();
        try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
        iframe.contentWindow.postMessage({ type: 'mg-theme', store, previewTheme: state.theme }, '*');
    }

    // ── render colour rows ─────────────────────────────────────────────
    function renderControls() {
        const host = document.getElementById('controls');
        host.innerHTML = '';
        VAR_GROUPS.forEach(group => {
            const gt = document.createElement('div');
            gt.className = 'group-title'; gt.textContent = group.title;
            host.appendChild(gt);
            group.vars.forEach(([k, label, kind]) => host.appendChild(makeRow(k, label, kind === 'triplet')));
        });
    }
    function makeRow(k, label, triplet) {
        const val = state.values[state.theme][k] ?? '';
        const c = parse(val); c.triplet = triplet;
        rowComponents[k] = c;

        const row = document.createElement('div'); row.className = 'row';
        const color = document.createElement('input'); color.type = 'color'; color.value = toHexInput(c);
        const mid = document.createElement('div'); mid.className = 'val';
        mid.innerHTML = `<div class="lbl">${label} <span class="var">${k}</span></div>`;
        const txt = document.createElement('input'); txt.className = 'txt'; txt.type = 'text'; txt.value = val;
        mid.appendChild(txt);
        if (!triplet) {
            const aw = document.createElement('div'); aw.className = 'alpha-wrap';
            const rng = document.createElement('input'); rng.type = 'range'; rng.className = 'alpha';
            rng.min = 0; rng.max = 100; rng.value = Math.round(c.a * 100);
            const al = document.createElement('span'); al.textContent = 'α ' + Math.round(c.a * 100) + '%';
            aw.appendChild(rng); aw.appendChild(al); mid.appendChild(aw);
            rng.addEventListener('input', () => { c.a = rng.value / 100; al.textContent = 'α ' + rng.value + '%'; commit(k, c, { color, txt, sw }); });
        }
        const sw = document.createElement('div'); sw.className = 'swatch';
        const swi = document.createElement('span'); swi.style.background = val; sw.appendChild(swi);

        color.addEventListener('input', () => { const p = parse(color.value); c.r = p.r; c.g = p.g; c.b = p.b; commit(k, c, { color, txt, sw }); });
        txt.addEventListener('input', () => { const p = parse(txt.value); p.triplet = triplet; rowComponents[k] = p; Object.assign(c, p); color.value = toHexInput(p); commit(k, c, { color, txt, sw }, true); });

        row.appendChild(color); row.appendChild(mid); row.appendChild(sw);
        return row;
    }
    function commit(k, c, els, fromText) {
        const v = format(c);
        state.values[state.theme][k] = v;
        if (!fromText) els.txt.value = v;
        els.sw.firstChild.style.background = v;
        push();
    }

    // ── logos ──────────────────────────────────────────────────────────
    function renderLogos() {
        const host = document.getElementById('logos'); host.innerHTML = '';
        LOGO_SLOTS.forEach(slot => {
            const block = document.createElement('div'); block.className = 'logo-block';
            block.innerHTML = `<h3>${slot.name}</h3>`;
            const vars = document.createElement('div'); vars.className = 'variants';
            LOGO_VARIANTS.forEach(vt => {
                const b = document.createElement('button');
                b.className = slot.dark ? 'dark' : 'light';
                if (state.logos[slot.id] === vt.src) b.classList.add('on');
                b.innerHTML = `<img src="${vt.src}" alt="${vt.id}">`;
                b.addEventListener('click', () => { state.logos[slot.id] = vt.src; renderLogos(); push(); });
                vars.appendChild(b);
            });
            block.appendChild(vars);
            const up = document.createElement('div'); up.className = 'upload';
            const id = 'up-' + slot.id;
            up.innerHTML = `<label for="${id}">⬆ Upload…</label><input id="${id}" type="file" accept="image/*">`;
            up.querySelector('input').addEventListener('change', e => {
                const f = e.target.files[0]; if (!f) return;
                const rd = new FileReader();
                rd.onload = () => { state.logos[slot.id] = rd.result; renderLogos(); push(); };
                rd.readAsDataURL(f);
            });
            block.appendChild(up);
            host.appendChild(block);
        });
    }

    // ── theme segment + preview toggle ─────────────────────────────────
    document.getElementById('theme-seg').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        state.theme = b.dataset.theme;
        document.querySelectorAll('#theme-seg button').forEach(x => x.classList.toggle('on', x === b));
        document.getElementById('preview-theme').textContent = state.theme === 'day' ? 'Light' : 'Dark';
        renderControls(); push();
    });
    document.getElementById('btn-toggle-preview').addEventListener('click', () => {
        const other = state.theme === 'day' ? 'night' : 'day';
        document.querySelector(`#theme-seg button[data-theme="${other}"]`).click();
    });

    // ── actions ─────────────────────────────────────────────────────────
    document.getElementById('btn-reset').addEventListener('click', () => {
        if (!confirm('Reset all colour + logo overrides?')) return;
        state.values = { day: { ...state.defaults.day }, night: { ...state.defaults.night } };
        state.logos = {};
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        renderControls(); renderLogos(); push();
        document.getElementById('export').style.display = 'none';
    });
    document.getElementById('btn-reload').addEventListener('click', () => { iframe.contentWindow.location.reload(); });
    document.getElementById('btn-export').addEventListener('click', () => {
        const store = buildStore();
        let css = '';
        ['day', 'night'].forEach(t => {
            const keys = Object.keys(store[t]);
            if (!keys.length) return;
            css += `[data-theme="${t}"] {\n`;
            keys.forEach(k => { css += `    ${k}: ${store[t][k]};\n`; });
            css += `}\n`;
        });
        const logos = Object.entries(store.logos).filter(([, v]) => v && !v.startsWith('data:'));
        if (logos.length) css += '\n/* Logos */\n' + logos.map(([k, v]) => `${k}: ${v}`).join('\n') + '\n';
        if (Object.values(store.logos).some(v => v && v.startsWith('data:'))) css += '\n/* + uploaded logo(s) — provide the file(s) to bake in */\n';
        const ta = document.getElementById('export');
        ta.value = css || '/* No overrides yet — everything matches the branch defaults. */';
        ta.style.display = 'block'; ta.select();
        try { navigator.clipboard.writeText(ta.value); } catch (e) {}
    });

    // ── init once the preview has loaded ───────────────────────────────
    iframe.addEventListener('load', () => {
        try {
            state.defaults.day = readThemeVars('[data-theme="day"]');
            state.defaults.night = readThemeVars('[data-theme="night"]');
        } catch (e) { console.warn('Could not read defaults', e); }
        // seed current values from defaults, then layer any saved overrides
        state.values = { day: { ...state.defaults.day }, night: { ...state.defaults.night } };
        try {
            const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
            ['day', 'night'].forEach(t => Object.assign(state.values[t], saved[t] || {}));
            if (saved.logos) state.logos = saved.logos;
        } catch (e) {}
        renderControls(); renderLogos(); push();
    }, { once: false });
})();
</script>
</body>
</html>
